<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gandon-PRO</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 35px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #4EC9B0;
            margin-top: 0;
            font-size: 26px;
        }
        p {
            color: #cccccc;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007acc;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gandon-PRO</h1>
        <p>The Interactive Disassembler & PE Analyzer</p>
        <p>Официальная страница проекта. Скоро здесь появятся ссылки на скачивание релизов.</p>
        <a class="btn" href="https://github.com/gandon-pro/">Мой GitHub</a>
    </div>
</body>
</html>
